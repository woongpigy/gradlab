<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light">
<title>대학원생 키우기</title>
<style>
  :root{--blue:#3182f6;--blue2:#e8f3ff;--bg:#f2f4f6;--card:#fff;--ink:#191f28;--sub:#6b7684;--line:#e5e8eb;--ok:#1aa36b;--warn:#f04452;--gold:#ffb331}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#dfe3e8;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
  #app{max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
  header{background:var(--card);padding:calc(8px + max(env(safe-area-inset-top), var(--sat, 0px))) 12px 8px;border-bottom:1px solid var(--line)}
  .who0{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .badge{background:var(--blue2);color:var(--blue);border-radius:999px;padding:2px 10px;font-size:13px}
  .res{display:flex;gap:6px;margin-top:6px}
  .res div{flex:1;background:var(--bg);border-radius:10px;padding:5px 8px}
  .res b{display:block;font-size:16px}
  .res small{color:var(--sub);font-size:11px}
  main{flex:1;overflow-y:auto;padding:10px 10px 20px}
  nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:max(env(safe-area-inset-bottom), var(--sab, 0px))}
  nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--sub);position:relative}
  nav button span{display:block;font-size:20px}
  nav button.on{color:var(--blue);font-weight:700}
  nav .dot{position:absolute;top:6px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
  .card h3{margin:0 0 8px;font-size:15px}
  .muted{color:var(--sub);font-size:13px}
  .row{display:flex;align-items:center;gap:8px}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0}
  .ico{font-size:28px;width:40px;text-align:center}
  .grow{flex:1;min-width:0}
  .grow b{font-size:15px}
  .btn{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:10px 12px;min-width:76px;line-height:1.25}
  .btn small{display:block;font-weight:500;font-size:11px;opacity:.9}
  .btn:disabled{background:#d1d6db;color:#fff}
  .btn.ghost{background:var(--blue2);color:var(--blue)}
  .btn.ad{background:#fff3d6;color:#a86b00}
  .btn.ghost:disabled,.btn.ad:disabled{background:#eef0f2;color:#b0b8c1}
  .btn.full{width:100%;margin-top:8px}
  .btn.sm{min-width:0;padding:6px 10px;font-size:13px}
  .locked{opacity:.45}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--blue);width:0}
  .paper{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
  .paper.ready{border-color:var(--ok);background:#effaf5}
  .paper.rev{border-color:var(--gold);background:#fff8e6}
  .paper.urgent{border-color:var(--warn);background:#fff1f2}
  .seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin:6px 0}
  .seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-size:13px}
  .seg button.on{background:#fff;font-weight:700;color:var(--blue)}
  .tag{display:inline-block;font-size:11px;background:var(--bg);border-radius:6px;padding:1px 6px;margin-left:4px;color:var(--sub);font-weight:600}
  .hint{background:#fff8e6;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
  .line{display:flex;align-items:center;justify-content:space-between;gap:4px;background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:13px}
  .line button{border:0;background:var(--bg);border-radius:10px;padding:6px 8px;font-size:13px}
  .line .warnb{background:#fff1f2;color:var(--warn);font-weight:700;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.6}}
  /* ---------- 연구실 방 (그래픽) ---------- */
  .roomWrap{border-radius:18px;overflow:hidden;margin-bottom:8px;box-shadow:0 2px 0 #d9ccb2}
  .wall{height:30px;background:linear-gradient(#d6dee8,#c3ccd8);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px 8px 0;position:relative}
  .wall i{display:block;background:linear-gradient(160deg,#f2f9ff 30%,#c4e3ff);border:3px solid #fff;border-bottom:0;border-radius:8px 8px 0 0;position:relative}
  .wall i::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff}
  #room{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px 8px;
    background:conic-gradient(#f5eddd 25%,#eee3cc 0 50%,#f5eddd 0 75%,#eee3cc 0) 0 0/46px 46px}
  .cell{position:relative;aspect-ratio:1/1.12;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px 2px 4px;font-size:11px;user-select:none;cursor:pointer}
  .cell.win{background:linear-gradient(rgba(196,227,255,.65),rgba(196,227,255,0) 55%)}
  .cell.place{outline:2px dashed rgba(0,0,0,.13);outline-offset:-3px}
  .cell.rng{background:rgba(49,130,246,.13)}
  .cell.sel{outline:3px solid var(--blue);outline-offset:-3px;background:rgba(49,130,246,.16)}
  .cell.sp{box-shadow:inset 0 0 0 2px rgba(255,179,49,.85),0 0 12px rgba(255,179,49,.55)}
  .spb{position:absolute;top:2px;left:3px;font-size:12px;z-index:2}
  .who{font-size:30px;line-height:1;margin-bottom:-5px;z-index:1;position:relative}
  .who.work{animation:type .45s infinite}
  .who.wr{animation:type 1.2s infinite}
  .who.zz{animation:nod 2.2s infinite;filter:grayscale(.65)}
  @keyframes type{50%{transform:translateY(-2px) rotate(-3deg)}}
  @keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(20deg) translateY(4px)}}
  .tbl{width:88%;height:22px;background:linear-gradient(#c49565,#a5733f);border-radius:6px 6px 3px 3px;box-shadow:0 3px 0 #7d5330;display:flex;justify-content:center}
  .tbl span{font-size:15px;margin-top:-11px}
  .cap{font-weight:700;font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .rt2{font-size:10px;color:var(--blue);font-weight:700;white-space:nowrap}
  .rolet{position:absolute;top:3px;right:3px;font-size:10px;background:rgba(255,255,255,.9);border-radius:6px;padding:0 3px;z-index:2}
  .obj{font-size:36px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.13))}
  .cell.it::after{content:'';position:absolute;bottom:20px;width:52%;height:7px;border-radius:50%;background:rgba(0,0,0,.1)}
  .zzz{position:absolute;top:22px;right:4px;font-size:16px;z-index:2;animation:bob 1.4s infinite}
  .bub{position:absolute;top:-6px;right:-2px;font-size:26px;border:0;background:none;animation:bob 1s infinite;z-index:4;padding:0;cursor:pointer}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .pt{position:absolute;width:7px;height:7px;border-radius:2px;background:#3182f6;box-shadow:0 0 4px #3182f6;transition:transform .8s ease-in,opacity .8s;z-index:3;pointer-events:none}
  .placebar{background:#fff;border-radius:14px;padding:10px;margin-bottom:8px;font-size:13px;border:2px solid var(--blue)}
  .tray{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tray button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 8px;font-size:20px}
  .tray button.on{border-color:var(--blue);background:var(--blue2)}
  #tapBtn{width:100%;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:20px;font-weight:800;padding:16px 0;box-shadow:0 4px 0 #1b64da;touch-action:manipulation;user-select:none}
  #tapBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b64da}
  #tapBtn small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
  #tapWrap{position:relative;margin-bottom:10px}
  .float{position:absolute;left:50%;top:6px;pointer-events:none;font-weight:800;color:var(--blue);animation:up .8s ease-out forwards;font-size:17px;z-index:3}
  @keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
  .spots{background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:6px}
  .todo .item{padding:8px 0}
  .stat{display:inline-block;min-width:76px;font-size:12px}
  .stars{color:var(--gold);letter-spacing:-1px}
  /* 리뷰 점수 */
  .scores{display:flex;gap:8px;justify-content:center;margin:8px 0}
  .sc{width:80px;background:var(--bg);border-radius:12px;padding:6px 0;opacity:0;animation:pop .35s forwards}
  .sc small{display:block;font-size:11px;color:var(--sub)}
  .sc b{font-size:28px}
  .sc.bad{background:#fff1f2;color:var(--warn)}
  @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
  /* 시트 */
  #modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
  #modal.hidden{display:none}
  .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + max(env(safe-area-inset-bottom), var(--sab, 0px)));text-align:center;max-height:88%;overflow-y:auto}
  .sheet .big{font-size:52px}
  .sheet h2{margin:6px 0;font-size:19px}
  .sheet p{color:#4e5968;font-size:15px;line-height:1.5;margin:6px 0 10px;word-break:keep-all}
  .sheet input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;text-align:center}
  .sheet .btn{width:100%;margin-top:8px;padding:13px;font-size:16px}
  .sheet .row .btn{width:auto;flex:1}
  .sheet .item .btn{width:auto;margin-top:0;padding:8px 12px;font-size:14px;flex:none}
  .sheet .item{text-align:left}
  .sheet .left{text-align:left}
  .reward{background:var(--bg);border-radius:12px;padding:10px;margin:8px 0;font-size:15px;line-height:1.7}
  #toast{position:absolute;left:50%;top:calc(6px + max(env(safe-area-inset-top), var(--sat, 0px)));transform:translateX(-50%);background:rgba(25,31,40,.9);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1}
  #exitBox{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:50}
  #exitBox.hidden{display:none}
  #modal.title{background:var(--bg);align-items:stretch}
  #modal.title .sheet{border-radius:0;max-height:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding-top:calc(18px + max(env(safe-area-inset-top), var(--sat, 0px)))}
  .proto{font-size:11px;color:var(--sub);text-align:center;margin-top:6px}
  .pa{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:3px}
  .pa span{width:46px}.pa .bar{flex:1;margin:0;height:7px}.pa small{width:78px;text-align:right;color:var(--sub)}
  .pa.N .bar i{background:#ff9f43}.pa.W .bar i{background:#8b5cf6}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px}
  .chips button.on{border-color:var(--blue);background:var(--blue2);color:var(--blue);font-weight:700}
  .lbl{font-size:12px;color:var(--sub);margin-top:6px}
  .pb{position:absolute;font-size:11px;font-weight:800;pointer-events:none;z-index:5;white-space:nowrap;animation:up2 1.1s ease-out forwards;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}
  @keyframes up2{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}
  .tro{position:absolute;right:10px;bottom:2px;font-size:15px;z-index:2;letter-spacing:-2px}
  .total{font-size:15px;margin:2px 0 6px}
  .cm{padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon_192.png">
<link rel="apple-touch-icon" href="icon_192.png">
<meta name="theme-color" content="#3182f6">
<meta name="description" content="대학원생이 되어 연구실을 꾸리고 학생을 키워 논문을 내며 교수까지 승진하는 타이쿤 게임">
</head>
<body>
<div id="app">
  <header>
    <div class="who0"><span id="hFace">🙂</span><span id="hName">이름</span><span class="badge" id="hStage">학부연구생</span></div>
    <div class="res">
      <div><small>📊 데이터</small><b id="hD">0</b><small id="hDr">+0/초</small></div>
      <div><small>💰 연구비</small><b id="hW">0</b><small id="hWr">+0/초</small></div>
      <div><small>📈 인용</small><b id="hC">0</b><small id="hCr">+0/시간</small></div>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="lab" class="on"><span>🧪</span>연구실</button>
    <button data-tab="people"><span>🧑‍🎓</span>사람<i class="dot" id="dotPeople" hidden></i></button>
    <button data-tab="work"><span>📄</span>성과<i class="dot" id="dotWork" hidden></i></button>
    <button data-tab="fac"><span>🏗️</span>시설</button>
    <button data-tab="more"><span>⋯</span>더보기</button>
  </nav>
  <div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
  <div id="exitBox" class="hidden"><div class="sheet"><div class="big">🚪</div><h2>오늘은 여기까지 할까요?</h2><p>진행은 자동으로 저장돼요.<br>자리를 비운 동안에도 연구실은 돌아가요.</p><button class="btn" data-act="exitYes">종료하기</button><button class="btn ghost" data-act="exitNo">계속하기</button></div></div>
  <div id="toast"></div>
</div>
<script>
'use strict';
/* =====================================================================
   대학원생 키우기 v1.0 (출시판 소스: 플랫폼 어댑터 window.PLATFORM)
   연구실 격자(책상·물건 배치, 붙여 놓기 효과, 스팟) → 서버 랙(처리) → 논문·과제
   - 수치: BAL / 분야별 글·이모지: THEME(테마팩)
   ===================================================================== */

// ---------------------------------------------------------------- 밸런스
const BAL = {
  equip: {base: 0.5, cost0: 10, growth: 1.13, tier: 25, tierMult: 3, maxLv: [40, 80, 120, 170, 220, 300]},
  tapBase: 1, tapPct: 0.05,
  server: {cap0: 15, capGrowth: 1.45, cost0: 60, costGrowth: 1.7, rackBonus: 0.15},
  grid: {w: 4, rows: [2, 4, 5, 6, 7, 8]},
  desks: {max: [1, 3, 5, 7, 9, 12], cost0: 30, growth: 5},
  hire: {cost0: 20, growth: 1.8, gradeMult: [1, 4, 15], gradeStage: [1, 2, 3], refresh: 600},
  student: {codeMult: 0.15, lvMult: 0.1, expPerMin: 1, statCap: 20, gradLv: 20, gradStage: 3, trainExp: 20, trainCost0: 40, trainGrowth: 1.6, gradBonus: 0.05},
  venues: [
    {cost: 60,   write: 20,   review: 120,   revs: 0, reward: 30,    cit: 0.5, unlock: 0, q: 0},
    {cost: 5e4,  write: 120,  review: 1800,  revs: 0, reward: 600,   cit: 2,   unlock: 1, q: 0},
    {cost: 8e7,  write: 300,  review: 7200,  revs: 1, reward: 8000,  cit: 8,   unlock: 2, q: 12},
    {cost: 3e10, write: 600,  review: 21600, revs: 1, reward: 1.2e5, cit: 25,  unlock: 3, q: 20},
    {cost: 8e12, write: 1200, review: 43200, revs: 2, reward: 2e6,   cit: 100, unlock: 4, q: 30},
  ],
  paperGrowth: 1.6, revReview: 1 / 3, wPerCit: 0.02,
  // 논문 (게임발전국식): 참신성 N · 실험 E · 글 W 점수 + 오류
  paper: {
    rateE: 0.5, rateW: 0.5, rateN: 0.25, bugRate: 0.05, debugRate: 0.06,
    compatMult: [0.8, 1, 1.2, 1.5], topicLvMult: 0.1,
    dirs: {normal: {cost: 1, time: 1, pts: 1, bug: 1, rp: 1}, careful: {cost: 1.3, time: 1.3, pts: 1.35, bug: 0.8, rp: 1},
           fast: {cost: 1.2, time: 0.6, pts: 0.75, bug: 1.4, rp: 1}, research: {cost: 1.5, time: 1, pts: 0.9, bug: 1, rp: 2.5}},
    req: [[36, 36, 30], [580, 250, 190], [4700, 2500, 1280], [36000, 9700, 7500], [145000, 27000, 30000]],   // [실험, 글, 참신성]
    repeatPen: 0.15,   // 같은 조합을 또 쓰면 참신성 −15%씩 (최대 −50%)
    th: {accept: 26, minor: 22, major: 16, hof: 32}, maxRev: 2,
    revTime: {minor: 0.5, major: 1}, revCostMinor: 0.2, revCostMajor: 0.35, revNeedMinor: 0.25, revNeedMajor: 0.45,
    resubCost: 0.2, resubBoost: 0.15, sequelCarry: 0.3, revRate: 0.55,
    rpPerBug: 0.12, rpReview: 0.6, rpPublish: [1, 1, 2, 3, 4], rpOrder: 0.3, rpAward: 8, rpGiveup: 2,
    unlockT: [0, 0, 0, 15, 30, 50, 75, 100], unlockM: [0, 0, 0, 10, 25, 40, 60],
    awardEvery: 3 * 86400, merchantGap: [900, 1500],
  },
  stages: [
    {mult: 1, slots: 1, req: null}, {mult: 1.5, slots: 2, req: [0, 1]},
    {mult: 1.5, slots: 2, req: [1, 2]}, {mult: 1.5, slots: 2, req: [2, 3]},
    {mult: 1.5, slots: 3, req: [3, 3]}, {mult: 1.5, slots: 3, req: [4, 2]},
  ],
  orders: {gap: [150, 300], max: 3, needSecs: [90, 420], patience: [1200, 3600], urgentPatience: [480, 720], urgentChance: 0.2, urgentMult: 2.5,
    reward: [0, 120, 1000, 8000, 6e4, 5e5], gradBonus: 0.03},
  // 연구실에 놓는 물건: cost[가진 개수] = 다음 하나 값(연구비), 배열 길이 = 최대 개수
  items: {
    rack:    {cost: [0, 400, 3000, 25000, 2e5, 2e6], stage: 1},
    plant:   {cost: [60, 120, 250, 500, 1000, 2000], stage: 1},
    coffee:  {cost: [300, 5000], stage: 1},
    board:   {cost: [1500, 2e4], stage: 1},
    shelf:   {cost: [3000, 3e4, 3e5], stage: 2},
    sofa:    {cost: [8000, 8e4], stage: 2},
    printer: {cost: [1.5e4], stage: 2},
  },
  // 놓지 않는 업그레이드
  upgrades: [
    {id: 'monitor', cost: 20, eff: 'tap', val: 2, stage: 0}, {id: 'keyboard', cost: 250, eff: 'tap', val: 2, stage: 1},
    {id: 'chair', cost: 5000, eff: 'cap', val: 4 * 3600, stage: 1}, {id: 'standing', cost: 1.2e5, eff: 'gen', val: 1.5, stage: 2},
    {id: 'office', cost: 1.5e6, eff: 'gen', val: 2, stage: 3},
  ],
  fx: {window: 2, plant: 1, rackProd: 0.1, rackMental: -1, study: 0.1, shelfWrite: 2, nightSpot: 0.2, writeSpotRev: 0.7, r2Quality: 5, brainIdea: 2, snackIdeaGap: 0.67, zenMental: 3},
  repeat: {base: 1e6, growth: 3, eff: 1.25},
  offCap: 8 * 3600, offEff: 0.5, sofaOffEff: 0.25,
  doze: {gap: [70, 160], auto: 120, sofaAuto: 60}, idea: {gap: [20, 45], life: 15, secs: 30},
  adLimits: {offline: 5, night: 6, fast: 5, event: 5, cands: 5}, nightSecs: 1800,
  eventGap: [200, 320],
};
// 스팟: 서로 2칸 안에 있는 물건 3개 → 주변 8칸 강화
const SPOTS = [
  {id: 'night', need: ['coffee', 'sofa', 'rack']},
  {id: 'brain', need: ['board', 'coffee', 'plant']},

const sum = a => a.reduce((x, y) => x + y, 0);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 10) return String(Math.floor(n * 10) / 10);
  if (n < 1e4) return Math.floor(n).toLocaleString('ko-KR');
  const i = Math.min(Math.floor(Math.log10(n) / 4), UNITS.length - 1), v = n / 1e4 ** i;

function bestUpgrade(reserve = 0) {
  let best = null;
  const raw = rawRate(false), cap = serverCap(), L = layout();
  S.desks.forEach((d, i) => {
    if (!d.sid || d.cell < 0 || d.lv >= equipMax()) return;
    const s = deskStu(d); if (d.sid !== 'me' && (!s || s.role !== 'exp')) return;
    const c = equipCost(d.lv); if (S.D - c < reserve) return;
    const now = deskRate(i, false), nxt = equipRate(d.lv + 1) * personMult(d, L.fx[i]) * L.fx[i].prod * globalMult(false);
    const gain = Math.min(raw - now + nxt, cap) - Math.min(raw, cap), g = gain / c;
    if (gain > 0 && (!best || g > best.g)) best = {kind: 'desk', i, cost: c, g};
  });
  if (serverOn()) {
    const c = serverCost();
    if (S.D - c >= reserve) { const gain = Math.min(raw, serverCap(S.server + 1)) - Math.min(raw, cap), g = gain / c; if (gain > 0 && (!best || g > best.g)) best = {kind: 'server', cost: c, g}; }
  }
  return best;
}
function paperReserve() { const tv = targetVenue(); return (!S.cleared && S.papers.length < slots() && BAL.venues[tv].unlock <= S.stage && S.D >= planCost(tv)) ? planCost(tv) : 0; }
function autoUpgrade() {
  const res = paperReserve(); let n = 0, sv = 0;
  for (let k = 0; k < 3000; k++) { const b = bestUpgrade(res); if (!b) break; S.D -= b.cost; if (b.kind === 'desk') S.desks[b.i].lv++; else { S.server++; sv++; } n++; }
  if (n) { click(); toast(`🛒 업그레이드 ${n}번${sv ? ` (서버 ${sv})` : ''}`); } else toast('지금은 올릴 수 있는 게 없어요');
}

    case 'placeOff': placeMode = false; selKey = null; break;
    case 'pick': selKey = b.dataset.k; break;
    case 'store': if (selKey && selKey[0] === 'i') { objRef(selKey).cell = -1; selKey = null; finalizeLayout(); } break;
    case 'recommend': recommendLayout(); selKey = null; S.usedPlace = 1; toast('✨ 추천 배치 완료'); break;
    case 'book': spotBook(); break;
    case 'desk': deskSheet(+b.dataset.i); break;
    case 'eq': upEquip(+b.dataset.i, +b.dataset.n); deskSheet(+b.dataset.i); break;
    case 'role': setRole(sid, b.dataset.r); deskSheet(S.desks.findIndex(d => d.sid === sid)); break;
    case 'train': train(sid); deskSheet(S.desks.findIndex(d => d.sid === sid)); break;
    case 'grad': graduate(sid); break;
    case 'idea': takeIdea(); break;
    case 'hire': hire(+b.dataset.i); break;
    case 'candAd': watchAd('cands', () => { newCands(); lastSig = ''; toast('새 지원자가 왔어요'); }); break;
    case 'addDesk': addDesk(); break;
    case 'buyItem': buyItem(b.dataset.id); break;
    case 'server': upServer(); break;
    case 'serverSheet': setTab('fac'); break;
    case 'upg': { const u = BAL.upgrades.find(x => x.id === b.dataset.id); if (u && !S.upg[u.id] && S.W >= u.cost) { S.W -= u.cost; S.upg[u.id] = 1; click(); toast(`${THEME.upgrades[u.id][1]} ${THEME.upgrades[u.id][0]}!`); } break; }
    case 'rep': if (S.W >= repCost()) { S.W -= repCost(); S.rep++; click(); } break;
    case 'auto': autoUpgrade(); break;
    case 'deliver': deliver(id); break;
    case 'open': openResult(id); break;
    case 'fast': fastReview(id); break;
    case 'startRev': startRev(id); break;
    case 'resub': resubmit(id, +b.dataset.low); break;
    case 'giveup': giveup(id); break;
    case 'skipDebug': skipDebug(id); break;
    case 'pv': S.plan.v = +b.dataset.v; break;
    case 'pt': S.plan.t = +b.dataset.t; break;
    case 'pm': S.plan.m = +b.dataset.m; break;
    case 'pd': S.plan.dir = b.dataset.d; break;
    case 'seqOff': S.plan.seq = -1; break;
    case 'sequel': S.plan.seq = +b.dataset.i; if (tab !== 'work') setTab('work'); break;
    case 'startPaper': if (startPaper(S.plan)) save(); break;
    case 'autoPlan': { const a = autoPlan(); if (startPaper(a)) { S.plan = Object.assign(S.plan, a); save(); } else toast('데이터가 모자라거나 논문 자리가 없어요'); break; }
    case 'unT': unlockTopic(+b.dataset.t); break;
    case 'unM': unlockMethod(+b.dataset.m); break;
    case 'buyShop': buyShop(b.dataset.id); merchantSheet(); break;
    case 'useItem': useItem(b.dataset.id); break;
    case 'night': if (!S.buffs.some(x => x.night)) watchAd('night', () => { S.buffs.push({k: 'gen', m: 2, until: S.t + BAL.nightSecs, night: 1}); toast('⚡ 밤샘 모드! 30분 동안 생산 ×2'); }); break;
    case 'tab': if (modalOpen) closeModal(); placeMode = false; setTab(b.dataset.tab); break;
    case 'offTake': takeOffline(1); break;
    case 'offTake2': closeModal(); { const po = pendingOffline; pendingOffline = null; watchAd('offline', () => { if (po) { S.D += po.dGain * 2; S.W += po.wGain * 2; } toast('2배로 받았어요!'); }, () => { if (po) { S.D += po.dGain; S.W += po.wGain; } }); } break;
    case 'evChoice': { const c = curEvent.choices[+b.dataset.i]; eventReward(c.eff, c.msg); break; }
    case 'mash': mashCount++; click(); b.textContent = `${curEvent.mashLabel} (${mashCount}/${curEvent.mash}) — 연타!`; if (mashCount >= curEvent.mash) eventReward(curEvent.win, curEvent.winMsg); break;
    case 'evLose': if (curEvent.lose) applyEff(curEvent.lose); sheet(`<div class="big">${curEvent.icon}</div><p>${curEvent.loseMsg}</p><button class="btn" data-act="close">확인</button>`); break;
    case 'evTake': takeEvent(1); break;
    case 'ev2': { const msg = ev2.choices[+b.dataset.i].fn(); ev2Result(msg); break; }
    case 'mash2': mashCount++; click(); b.textContent = `${ev2.mash.label} (${mashCount}/${ev2.mash.n}) — 연타!`; if (mashCount >= ev2.mash.n) ev2Result(ev2.mash.win()); break;
    case 'ev2lose': ev2Result(ev2.mash.lose()); break;
    case 'season': closeModal(); seasonCheck(b.dataset.id); break;
    case 'evPreview': sheet(`<h2>🎲 이벤트 미리 보기</h2><p class="muted">시제품 테스트용 (조건이 맞아야 떠요)</p>
      <div class="lbl">학생·외부</div><div class="chips">${EV2.map(e => `<button data-act="testEvent" data-id="${e.id}">${EVN[e.id] || e.id}</button>`).join('')}</div>
      <div class="lbl">논문 쓰는 중</div><div class="chips"><button data-act="testPaperEv">집필 이벤트</button></div>
      <div class="lbl">달력·시즌</div><div class="chips">${SEASONS.map(se => `<button data-act="season" data-id="${se.id}">${se.icon} ${se.title}</button>`).join('')}</div>
      <button class="btn ghost" data-act="close">닫기</button>`); break;
    case 'testEvent': { closeModal(); const e = EV2.find(x => x.id === b.dataset.id); const c = e && e.cond(); if (c) showEv2(e.make(c)); else toast('지금은 조건이 안 맞아요'); break; }
    case 'testPaperEv': { closeModal(); const p = S.papers.find(p => p.state === 'writing'); if (p) paperEvent2(p); else toast('쓰고 있는 논문이 없어요'); break; }
    case 'evTake2': { const amt = pendingEvent; pendingEvent = null; closeModal(); watchAd('event', () => { S.D += (amt.D || 0) * 2; S.W += (amt.W || 0) * 2; toast('2배로 받았어요!'); }, () => { S.D += amt.D || 0; S.W += amt.W || 0; }); break; }
    case 'share': { const st = +b.dataset.st; const txt = `🎓 ${S.name}이(가) ${THEME.stages[st].name}이 되었어요! — 대학원생 키우기`; try { navigator.clipboard.writeText(txt).catch(() => {}); } catch (err) {} toast('공유 문구를 복사했어요 (실제 앱은 토스 공유)'); break; }
    case 'sound': S.sound = !S.sound; if (S.sound) soundResume(); click(); break;
    case 'exitYes': save(true); $('exitBox').classList.add('hidden'); if (PF.close) PF.close(); break;
    case 'exitNo': $('exitBox').classList.add('hidden'); break;
    case 'resetAsk': sheet(`<div class="big">⚠️</div><h2>처음부터 다시 할까요?</h2><p>모든 진행이 지워져요.</p><button class="btn" data-act="reset" style="background:var(--warn)">다시 시작</button><button class="btn ghost" data-act="close">취소</button>`); break;
    case 'reset': try { localStorage.removeItem(SKEY); } catch (err) {} PF.remove(SKEY).catch(() => {}); lastSavedStr = ''; S = newState(); LC = {ver: -1}; S.sessions = 1; closeModal(); askName(); setTab('lab'); break;
    case 'start': S.name = ($('nameIn').value || '').trim().slice(0, 8) || '김연구'; closeModal(); save(); break;
  }
  if (a !== 'mash') lastSig = '';
  render();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { placeMode = false; setTab(b.dataset.tab); } });
function setTab(t) { tab = t; lastSig = ''; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === t)); $('view').innerHTML = ''; render(); $('view').scrollTop = 0; }
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !modalBusy() && tab === 'lab' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); tap(); } });
function askName() {
  sheet(`<div style="font-size:15px;font-weight:800;color:var(--blue);letter-spacing:1px;margin-bottom:28px">🎓 대학원생 키우기</div><div class="big">🙂</div><h2>오늘부터 연구실 학부연구생!</h2><p>교수님: “이름이 뭐였더라?”</p><input id="nameIn" maxlength="8" placeholder="김연구"><button class="btn" data-act="start">연구실 들어가기</button>`);
  $('modal').classList.add('title');
  setTimeout(() => $('nameIn') && $('nameIn').focus(), 50);
}

// ---------------------------------------------------------------- 시작·루프
let lastFrame = performance.now(), saveAt = 0;
function frame() {
  const now = performance.now(); let dt = (now - lastFrame) / 1000; lastFrame = now;
  if (document.hidden) return;
  if (dt > 1) dt = 1;
  if (adPlaying) dt = 0;
  // 들어오자마자 뜬 '다녀오셨어요' 창: 광고가 늦게 준비되면 '2배 받기' 버튼을 붙여 다시 그림
  if (pendingOffline && modalOpen && pendingOffline.dGain > 0 && adsOn() && adLeft('offline') > 0 && !document.querySelector('#sheet [data-act=offTake2]') && document.querySelector('#sheet [data-act=offTake]')) offlineSheet(pendingOffline);
  step(dt, dt);
  render();
  if (now - saveAt > 5000) { save(); saveAt = now; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(true); soundPause(); return; }
  soundResume();
  const secs = Math.max(0, (Date.now() - S.lastReal) / 1000); lastFrame = performance.now();
  if (secs >= 60) { S.sessions++; offline(secs); } else if (secs > 1) step(secs);
  dailyCheck();
});
window.addEventListener('pagehide', () => save(true));
function applyInsets(i) { if (!i) return; const r = document.documentElement.style; r.setProperty('--sat', (i.top || 0) + 'px'); r.setProperty('--sab', (i.bottom || 0) + 'px'); }
(async function init() {
  const within = (p, ms) => Promise.race([Promise.resolve().then(() => p), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
  let info = {userKey: ''};
  try { info = (await within(PF.init(), 5000)) || info; } catch (e) {}
  SKEY = KEY + (info.userKey ? '_' + String(info.userKey).slice(0, 32) : '');
  if (PF.insets) try { applyInsets(PF.insets.get()); PF.insets.subscribe(applyInsets); } catch (e) {}
  if (PF.onBack) try { PF.onBack(() => { const x = $('exitBox'); if (x.classList.contains('hidden')) x.classList.remove('hidden'); else x.classList.add('hidden'); }); } catch (e) {}
  let raw = null;
  if (PF.name !== 'web') { try { raw = await within(PF.load(SKEY), 8000); } catch (e) { bridgeOK = false; } }   // 못 읽었으면 토스 저장소에 덮어쓰지 않음
  if (!raw) try { raw = localStorage.getItem(SKEY); } catch (e) {}
  const saved = parseSave(raw);
  lastSavedStr = raw || '';
  if (saved) { S = saved; bump(); const secs = Math.max(0, (Date.now() - S.lastReal) / 1000); if (secs >= 60) { S.sessions++; offline(secs); } else step(secs); dailyCheck(); }
  else { S.sessions = 1; askName(); }
  render(); lastFrame = performance.now(); setInterval(frame, 100);
})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
